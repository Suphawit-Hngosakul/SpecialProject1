<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 SPL — Live Audio</title>
  <style>
    :root {
      --bg:      #0f0f0f;
      --surf:    #1a1a1a;
      --surf2:   #222;
      --bord:    #2a2a2a;
      --text:    #f1f1f1;
      --muted:   #aaa;
      --dim:     #555;
      --red:     #ff0000;
      --red2:    #cc0000;
      --blue:    #3ea6ff;
      --green:   #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text);
           font-family: "Roboto", Arial, sans-serif;
           min-height: 100vh; }

    /* ── Navbar ── */
    nav {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 24px; background: var(--bg);
      border-bottom: 1px solid var(--bord);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-logo { font-size: 1.05rem; font-weight: 700; }
    .nav-logo span { color: var(--red); }
    .live-badge {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em;
      padding: 2px 7px; border-radius: 3px;
      background: var(--dim); opacity: 0.6; transition: all 0.3s;
    }
    .live-badge.on { background: var(--red); opacity: 1; }
    nav .sp { flex: 1; }

    /* ── Layout ── */
    .main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 120px; }

    /* ── Player ── */
    .player-wrap {
      background: #000; border-radius: 10px; overflow: hidden;
      position: relative; margin-bottom: 0;
    }
    canvas#viz { display: block; width: 100%; height: 210px; }
    .player-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 20px 18px 12px;
    }
    .p-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 3px; }
    .p-meta  { font-size: 0.75rem; color: var(--muted); }
    .player-ctrl {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 14px; background: var(--surf);
      border-radius: 0 0 10px 10px; margin-bottom: 28px;
    }
    .cbtn {
      background: none; border: none; color: var(--text);
      font-size: 1.25rem; cursor: pointer; padding: 5px 8px;
      border-radius: 6px; transition: background 0.15s; line-height: 1;
    }
    .cbtn:hover { background: rgba(255,255,255,0.1); }
    .cbtn.on { color: var(--red); }
    .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    input[type=range] { width: 76px; accent-color: var(--blue); cursor: pointer; }
    .sp2 { flex: 1; }
    .spl-pill { background: var(--surf2); font-size: 0.75rem;
                padding: 3px 10px; border-radius: 20px; color: var(--muted); }
    .spl-pill b { color: var(--blue); }

    /* ── Section title ── */
    .sec-hd {
      display: flex; align-items: center; margin-bottom: 14px;
    }
    .sec-hd h2 { font-size: 0.95rem; font-weight: 600; }
    .sec-hd .latest {
      font-size: 0.72rem; color: var(--muted); margin-left: 10px; flex: 1;
    }
    .sec-hd .latest b { color: var(--green); font-weight: 600; }
    .sec-hd .latest .ago { color: var(--dim); margin-left: 4px; }
    .sec-hd button {
      background: none; border: 1px solid var(--bord);
      color: var(--muted); font-size: 0.75rem;
      padding: 4px 12px; border-radius: 18px; cursor: pointer;
      transition: all 0.15s; margin-left: 8px;
    }
    .sec-hd button:hover { background: var(--surf2); color: var(--text); }
    .sec-hd button.act  { border-color: var(--red); color: var(--red); }

    /* ── Day tabs ── */
    .day-tabs {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .day-tab {
      background: var(--surf2); border: 1px solid var(--bord);
      color: var(--muted); font-size: 0.75rem;
      padding: 5px 14px; border-radius: 18px; cursor: pointer;
      transition: all 0.15s;
    }
    .day-tab:hover { border-color: var(--muted); color: var(--text); }
    .day-tab.act { background: var(--red2); border-color: var(--red); color: #fff; }

    /* ── Scrubber ── */
    .scr-wrap { position: relative; padding: 0 0 6px; user-select: none; }

    /* Time labels */
    .scr-labels {
      position: relative; height: 18px; margin-bottom: 4px;
    }
    .scr-lbl {
      position: absolute; font-size: 0.62rem; color: var(--dim);
      transform: translateX(-50%); white-space: nowrap;
    }

    /* Bar track */
    .scr-track {
      position: relative; height: 5px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px; cursor: pointer;
      transition: height 0.15s;
    }
    .scr-track:hover { height: 8px; }

    /* Segment blocks */
    .scr-seg {
      position: absolute; top: 0; height: 100%;
      background: var(--red2); border-radius: 2px;
      cursor: pointer; transition: background 0.15s, transform 0.1s;
      min-width: 3px;
    }
    .scr-seg:hover { background: var(--red); transform: scaleY(1.8); }
    .scr-seg.playing { background: var(--green) !important; }
    .scr-seg.watched { background: #8b0000; }

    /* Chapter dividers (white tick between chapters — like YouTube) */
    .scr-div {
      position: absolute; top: -2px; bottom: -2px;
      width: 2px; background: var(--bg);
      pointer-events: none; z-index: 3;
    }

    /* Playhead dot */
    .scr-head {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      width: 13px; height: 13px; background: #fff;
      border-radius: 50%; pointer-events: none;
      display: none; z-index: 5; transition: left 0.3s linear;
      box-shadow: 0 0 4px rgba(0,0,0,0.6);
    }

    /* Hover tooltip */
    .scr-tip {
      position: absolute; bottom: calc(100% + 14px);
      background: rgba(0,0,0,0.92);
      border: 1px solid var(--bord);
      border-radius: 8px; padding: 8px 12px;
      font-size: 0.72rem; pointer-events: none;
      white-space: nowrap; display: none;
      transform: translateX(-50%);
      z-index: 20;
    }
    .scr-tip .tt-time { color: #fff; font-weight: 600; margin-bottom: 2px; }
    .scr-tip .tt-name { color: var(--muted); margin-bottom: 2px; }
    .scr-tip .tt-size { color: var(--dim); }
    .scr-tip::after {
      content: ''; position: absolute; top: 100%; left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0,0,0,0.92);
    }

    /* ── Now-playing controls ── */
    .np-ctrl {
      display: flex; align-items: center; gap: 10px;
      margin-top: 16px; padding: 10px 14px;
      background: var(--surf); border-radius: 10px;
    }
    .np-btn {
      background: none; border: none; color: var(--muted);
      font-size: 1.1rem; cursor: pointer; padding: 4px 8px;
      border-radius: 6px; transition: all 0.15s; line-height: 1;
    }
    .np-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .np-btn.main { font-size: 1.4rem; color: var(--text); }
    .np-info { flex: 1; min-width: 0; }
    .np-time { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .np-name { font-size: 0.72rem; color: var(--muted); margin-top: 1px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-dur  { font-size: 0.72rem; color: var(--dim); flex-shrink: 0; }

    /* ── Grid ── */
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 10px; margin-top: 20px;
    }
    .rec-card { cursor: pointer; border-radius: 8px; overflow: hidden;
                transition: transform 0.15s; }
    .rec-card:hover { transform: translateY(-2px); }
    .rec-thumb {
      position: relative; width: 100%; padding-top: 56.25%;
      border-radius: 8px 8px 0 0;
    }
    .rec-thumb-inner {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; opacity: 0.6;
    }
    .rec-dur {
      position: absolute; bottom: 5px; right: 7px;
      background: rgba(0,0,0,0.8); color: #fff;
      font-size: 0.66rem; padding: 1px 5px; border-radius: 3px; font-weight: 600;
    }
    .rec-card.playing .rec-thumb-inner::after {
      content: '▶'; font-size: 2rem; position: absolute;
      inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.5); color: #fff;
    }
    .rec-info { background: var(--surf); padding: 7px 8px 8px; }
    .rec-rtime { font-size: 0.8rem; font-weight: 500; }
    .rec-rdate { font-size: 0.7rem; color: var(--muted); margin-top: 1px; }
    .rec-rsize { font-size: 0.68rem; color: var(--dim); }

    .grid-msg { color: var(--dim); font-size: 0.85rem; padding: 16px 0; }

    /* ── Fixed bottom audio bar ── */
    .audio-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surf); border-top: 1px solid var(--bord);
      padding: 8px 20px;
      display: flex; align-items: center; gap: 14px;
      transform: translateY(100%); transition: transform 0.25s ease;
      z-index: 200;
    }
    .audio-bar.up { transform: translateY(0); }
    audio#audioEl { flex: 1; height: 30px; accent-color: var(--red); min-width: 0; }
    .ab-title { font-size: 0.78rem; font-weight: 500;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                max-width: 220px; }
    .ab-close { background: none; border: none; color: var(--muted);
                font-size: 1.1rem; cursor: pointer; }
    .ab-close:hover { color: var(--text); }

    @media (max-width:600px) {
      .main { padding: 12px 12px 110px; }
      canvas#viz { height: 150px; }
      .rec-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      audio#audioEl { max-width: 160px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">ESP32 <span>●</span> Audio</div>
  <div class="live-badge" id="liveBadge">LIVE</div>
  <div class="sp"></div>
</nav>

<div class="main">

  <!-- ── Live player ───────────────────────────────────────────────────────── -->
  <div class="player-wrap">
    <canvas id="viz"></canvas>
    <div class="player-overlay">
      <div class="p-title">esp32-spl-001 · Environmental Audio Logger</div>
      <div class="p-meta" id="pMeta">Offline</div>
    </div>
  </div>
  <div class="player-ctrl">
    <button class="cbtn" id="liveBtn">▶</button>
    <div class="vol">
      <span>🔊</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
    </div>
    <div class="sp2"></div>
    <div class="spl-pill" id="splPill" style="display:none">SPL <b id="splV">—</b> dB</div>
  </div>

  <!-- ── Recordings ────────────────────────────────────────────────────────── -->
  <div class="sec-hd">
    <h2>Past Recordings</h2>
    <span class="latest" id="latestInfo">No recordings yet</span>
    <button id="viewScr" class="act">Timeline</button>
    <button id="viewGrid">Grid</button>
    <button id="refreshBtn">↺</button>
  </div>

  <!-- Day tabs -->
  <div class="day-tabs" id="dayTabs"></div>

  <!-- Scrubber (timeline view) -->
  <div id="scrView">
    <div class="scr-wrap">
      <div class="scr-labels" id="scrLabels"></div>
      <div class="scr-track" id="scrTrack">
        <div class="scr-head" id="scrHead"></div>
        <div class="scr-tip"  id="scrTip">
          <div class="tt-time" id="ttTime"></div>
          <div class="tt-name" id="ttName"></div>
          <div class="tt-size" id="ttSize"></div>
        </div>
      </div>
    </div>
    <div class="np-ctrl">
      <button class="np-btn" id="prevBtn">⏮</button>
      <button class="np-btn main" id="npPlayBtn">▶</button>
      <button class="np-btn" id="nextBtn">⏭</button>
      <div class="np-info">
        <div class="np-time" id="npTime">—</div>
        <div class="np-name" id="npName">Select a recording on the timeline</div>
      </div>
      <div class="np-dur" id="npDur"></div>
    </div>
  </div>

  <!-- Grid view (hidden by default) -->
  <div id="gridView" style="display:none">
    <div class="rec-grid" id="recGrid">
      <div class="grid-msg">Loading…</div>
    </div>
  </div>

</div><!-- .main -->

<!-- Fixed audio bar -->
<div class="audio-bar" id="audioBar">
  <audio id="audioEl"></audio>
  <div class="ab-title" id="abTitle">—</div>
  <button class="ab-close" id="abClose">✕</button>
</div>

<script>
const WS_URL      = `ws://${location.hostname}:${location.port || 5002}`;
const API_BASE    = `http://${location.hostname}:${location.port || 5002}`;
const SAMPLE_RATE = 16000;
const SCHED_AHEAD = 0.08;
const MAX_BUF     = 0.5;

// ─────────────────────────────────────────────────────────────────────────────
// VISUALIZER
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('viz');
const cx     = canvas.getContext('2d');
let analyser = null, animId = null;

function resizeCv() {
  canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
}
window.addEventListener('resize', () => { resizeCv(); renderScrubber(); });
resizeCv();

function drawFrame() {
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  if (!analyser) {
    cx.fillStyle = '#000'; cx.fillRect(0,0,W,H);
    cx.strokeStyle = '#1c1c1c'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(0,H/2); cx.lineTo(W,H/2); cx.stroke();
    cx.fillStyle = '#2a2a2a'; cx.font = '13px Arial'; cx.textAlign = 'center';
    cx.fillText('▶  Press to start live stream', W/2, H/2 + 34);
  } else {
    const fBuf = new Uint8Array(analyser.frequencyBinCount);
    const wBuf = new Uint8Array(analyser.fftSize);
    analyser.getByteFrequencyData(fBuf);
    analyser.getByteTimeDomainData(wBuf);
    cx.fillStyle = 'rgba(0,0,0,0.22)'; cx.fillRect(0,0,W,H);
    const bars = 80, maxBin = Math.floor(fBuf.length * 0.55);
    for (let i = 0; i < bars; i++) {
      const v  = fBuf[Math.floor(i * maxBin / bars)] / 255;
      const bh = v * H * 0.44;
      cx.fillStyle = `hsl(${200 + v*50},80%,${32+v*32}%)`;
      cx.fillRect(i*(W/bars)+1, H/2-bh, W/bars-2, bh*2);
    }
    cx.beginPath(); cx.strokeStyle = 'rgba(62,166,255,0.55)'; cx.lineWidth = 1.5;
    const sw = W / wBuf.length;
    wBuf.forEach((v,i) => {
      const y = (v/128-1)*(H*0.18)+H/2;
      i===0 ? cx.moveTo(0,y) : cx.lineTo(i*sw,y);
    });
    cx.stroke();
  }
  animId = requestAnimationFrame(drawFrame);
}
drawFrame();

// ─────────────────────────────────────────────────────────────────────────────
// LIVE AUDIO
// ─────────────────────────────────────────────────────────────────────────────
let audioCtx, gainNode, ws, nextTime = 0, live = false;
const liveBtn   = document.getElementById('liveBtn');
const liveBadge = document.getElementById('liveBadge');
const pMeta     = document.getElementById('pMeta');
const splPill   = document.getElementById('splPill');
const splV      = document.getElementById('splV');
const volSlider = document.getElementById('volSlider');

volSlider.addEventListener('input', () => { if (gainNode) gainNode.gain.value = +volSlider.value; });

function schedChunk(int16) {
  const f32 = new Float32Array(int16.length);
  let sq = 0;
  for (let i=0; i<int16.length; i++) { f32[i] = int16[i]/32768; sq += f32[i]*f32[i]; }
  const rms = Math.sqrt(sq/int16.length);
  if (rms > 1e-5) splV.textContent = (20*Math.log10(rms)+115).toFixed(1);
  const buf = audioCtx.createBuffer(1, f32.length, SAMPLE_RATE);
  buf.getChannelData(0).set(f32);
  const src = audioCtx.createBufferSource();
  src.buffer = buf; src.connect(gainNode);
  if (nextTime - audioCtx.currentTime > MAX_BUF) nextTime = audioCtx.currentTime + SCHED_AHEAD;
  const at = Math.max(audioCtx.currentTime + SCHED_AHEAD, nextTime);
  src.start(at); nextTime = at + buf.duration;
}

function startLive() {
  audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE }); nextTime = 0;
  gainNode = audioCtx.createGain(); gainNode.gain.value = +volSlider.value;
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024; analyser.smoothingTimeConstant = 0.8;
  gainNode.connect(analyser); analyser.connect(audioCtx.destination);
  ws = new WebSocket(WS_URL); ws.binaryType = 'arraybuffer';
  ws.onopen    = () => { live=true; liveBtn.textContent='⏹'; liveBtn.classList.add('on'); liveBadge.className='live-badge on'; liveBadge.textContent='● LIVE'; pMeta.textContent='Streaming from esp32-spl-001'; splPill.style.display=''; };
  ws.onmessage = e => { if (e.data instanceof ArrayBuffer) schedChunk(new Int16Array(e.data)); };
  ws.onclose   = () => stopLive(false);
  ws.onerror   = () => { pMeta.textContent='Connection error'; };
}
function stopLive(manual=true) {
  ws?.close(); audioCtx?.close(); analyser=null; live=false;
  liveBtn.textContent='▶'; liveBtn.classList.remove('on');
  liveBadge.className='live-badge'; liveBadge.textContent='LIVE';
  pMeta.textContent = manual ? 'Stopped' : 'Disconnected';
  splPill.style.display='none';
}
liveBtn.addEventListener('click', () => live ? stopLive() : startLive());

// ─────────────────────────────────────────────────────────────────────────────
// RECORDINGS DATA
// ─────────────────────────────────────────────────────────────────────────────
let allRecs = [], byDay = {}, days = [], curDay = null, curIdx = -1;

function parseRec(rec) {
  const m = rec.name.match(/audio_(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})(\d{2})\.wav/);
  if (!m) return null;
  return { ...rec,
    date: `${m[1]}-${m[2]}-${m[3]}`,
    time: `${m[4]}:${m[5]}:${m[6]}`,
    minOfDay: parseInt(m[4])*60 + parseInt(m[5]),
    tsMs: Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]),
  };
}

function fmtAgo(ms) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60)     return `${s}s ago`;
  if (s < 3600)   return `${Math.floor(s/60)}m ago`;
  if (s < 86400)  return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

const latestInfo = document.getElementById('latestInfo');
function updateLatest() {
  if (!allRecs.length) { latestInfo.textContent = 'No recordings yet'; return; }
  const newest = allRecs.reduce((a, b) => a.tsMs > b.tsMs ? a : b);
  latestInfo.innerHTML = `Latest: <b>${newest.date} ${newest.time}</b> UTC <span class="ago">(${fmtAgo(newest.tsMs)})</span>`;
}
setInterval(updateLatest, 30000);   // refresh "X ago" every 30s

async function loadRecordings() {
  try {
    const res = await fetch(`${API_BASE}/api/recordings`);
    allRecs = (await res.json()).map(parseRec).filter(Boolean);
    allRecs.sort((a,b) => a.key < b.key ? -1 : 1);

    byDay = {};
    allRecs.forEach(r => { if (!byDay[r.date]) byDay[r.date] = []; byDay[r.date].push(r); });
    days = Object.keys(byDay).sort().reverse();
    curDay = days[0] || null;

    buildDayTabs();
    renderScrubber();
    renderGrid();
    updateLatest();
  } catch(e) {
    document.getElementById('recGrid').innerHTML = `<div class="grid-msg">Error: ${e.message}</div>`;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// DAY TABS
// ─────────────────────────────────────────────────────────────────────────────
function buildDayTabs() {
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  days.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (d === curDay ? ' act' : '');
    btn.textContent = d;
    btn.onclick = () => { curDay = d; buildDayTabs(); renderScrubber(); };
    el.appendChild(btn);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// SCRUBBER
// ─────────────────────────────────────────────────────────────────────────────
const scrTrack  = document.getElementById('scrTrack');
const scrHead   = document.getElementById('scrHead');
const scrTip    = document.getElementById('scrTip');
const scrLabels = document.getElementById('scrLabels');

function renderScrubber() {
  // Clear previous segments & dividers
  scrTrack.querySelectorAll('.scr-seg,.scr-div').forEach(e => e.remove());

  if (!curDay || !byDay[curDay]) return;
  const recs = byDay[curDay];
  const TW   = 1440; // total minutes in day

  // Hour labels (every 2 hours)
  scrLabels.innerHTML = '';
  for (let h = 0; h <= 24; h += 2) {
    const pct = (h*60/TW*100).toFixed(3);
    const lbl = document.createElement('span');
    lbl.className = 'scr-lbl';
    lbl.style.left = `${pct}%`;
    lbl.textContent = `${String(h).padStart(2,'0')}:00`;
    scrLabels.appendChild(lbl);
  }

  // Segments
  recs.forEach((rec, idx) => {
    const left  = (rec.minOfDay / TW * 100).toFixed(4);
    const width = Math.max(0.15, 1/TW*100).toFixed(4);

    // Chapter divider before segment
    const div = document.createElement('div');
    div.className = 'scr-div';
    div.style.left = `${left}%`;
    scrTrack.appendChild(div);

    // Segment block
    const seg = document.createElement('div');
    seg.className = 'scr-seg';
    seg.style.left  = `${left}%`;
    seg.style.width = `${width}%`;
    seg.dataset.idx = idx;

    if (idx === curIdx) seg.classList.add('playing');
    else if (idx < curIdx) seg.classList.add('watched');

    // Hover → tooltip
    seg.addEventListener('mouseenter', e => showTip(e, rec));
    seg.addEventListener('mousemove',  e => moveTip(e));
    seg.addEventListener('mouseleave', hideTip);
    seg.addEventListener('click', () => selectRec(idx));

    scrTrack.appendChild(seg);
  });
}

function showTip(e, rec) {
  document.getElementById('ttTime').textContent = `${rec.time} UTC`;
  document.getElementById('ttName').textContent = rec.name;
  document.getElementById('ttSize').textContent = `${rec.size_kb} KB · 1:00`;
  scrTip.style.display = 'block';
  moveTip(e);
}
function moveTip(e) {
  const r = scrTrack.getBoundingClientRect();
  const x = e.clientX - r.left;
  const pct = (x / r.width * 100).toFixed(2);
  scrTip.style.left = `${pct}%`;
}
function hideTip() { scrTip.style.display = 'none'; }

// ─────────────────────────────────────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────────────────────────────────────
const audioEl  = document.getElementById('audioEl');
const audioBar = document.getElementById('audioBar');
const abTitle  = document.getElementById('abTitle');
const npPlayBtn = document.getElementById('npPlayBtn');
const npTime   = document.getElementById('npTime');
const npName   = document.getElementById('npName');
const npDur    = document.getElementById('npDur');

document.getElementById('abClose').addEventListener('click', () => {
  audioEl.pause(); audioBar.classList.remove('up');
  scrTrack.querySelectorAll('.scr-seg.playing').forEach(s => s.classList.remove('playing'));
  scrHead.style.display = 'none'; curIdx = -1; updateNpCtrl();
});

audioEl.addEventListener('ended', () => {
  const recs = byDay[curDay] || [];
  if (curIdx + 1 < recs.length) selectRec(curIdx + 1);
  else { curIdx = -1; updateNpCtrl(); }
});

audioEl.addEventListener('timeupdate', () => {
  if (!curDay || curIdx < 0) return;
  const rec = byDay[curDay][curIdx];
  const min = rec.minOfDay + audioEl.currentTime / 60;
  const pct = (min / 1440 * 100).toFixed(3);
  scrHead.style.left    = `${pct}%`;
  scrHead.style.display = 'block';
});

audioEl.addEventListener('play',  () => { npPlayBtn.textContent = '⏸'; });
audioEl.addEventListener('pause', () => { npPlayBtn.textContent = '▶'; });

npPlayBtn.addEventListener('click', () => {
  if (audioEl.paused) audioEl.play(); else audioEl.pause();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (curIdx > 0) selectRec(curIdx - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const recs = byDay[curDay] || [];
  if (curIdx + 1 < recs.length) selectRec(curIdx + 1);
});

function updateNpCtrl() {
  const recs = byDay[curDay] || [];
  const rec  = recs[curIdx];
  if (!rec) {
    npTime.textContent = '—';
    npName.textContent = 'Select a recording on the timeline';
    npDur.textContent  = '';
    npPlayBtn.textContent = '▶';
    return;
  }
  npTime.textContent = rec.time + ' UTC';
  npName.textContent = rec.date;
  npDur.textContent  = '1:00';
}

async function selectRec(idx) {
  const recs = byDay[curDay] || [];
  if (idx < 0 || idx >= recs.length) return;

  // Update segment highlights
  scrTrack.querySelectorAll('.scr-seg').forEach((seg, i) => {
    seg.classList.remove('playing','watched');
    if (i === idx) seg.classList.add('playing');
    else if (i < idx) seg.classList.add('watched');
  });

  curIdx = idx;
  updateNpCtrl();

  const rec = recs[idx];
  try {
    const res = await fetch(`${API_BASE}/api/url?key=${encodeURIComponent(rec.key)}`);
    const url = await res.text();
    audioEl.src = url;
    abTitle.textContent = `${rec.time} UTC  ·  ${rec.date}  ·  ${rec.size_kb} KB`;
    audioBar.classList.add('up');
    audioEl.play();
  } catch(e) { console.error(e); }

  // Sync grid card highlight
  document.querySelectorAll('.rec-card').forEach((c, i) => {
    c.classList.toggle('playing', i === idx);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// GRID VIEW
// ─────────────────────────────────────────────────────────────────────────────
function thumbGrad(name) {
  const m = name.match(/_(\d{2})\d{4}\.wav$/);
  const h = m ? parseInt(m[1]) : 12;
  const g = h<6?['#0f172a','#1e3a5f']:h<9?['#7c3aed','#f59e0b']:h<12?['#0ea5e9','#7dd3fc']:h<17?['#2563eb','#06b6d4']:h<20?['#f97316','#ef4444']:['#6d28d9','#ec4899'];
  return `linear-gradient(135deg,${g[0]},${g[1]})`;
}

function renderGrid() {
  const grid = document.getElementById('recGrid');
  const recs = curDay ? (byDay[curDay] || []) : [];
  if (!recs.length) { grid.innerHTML = '<div class="grid-msg">No recordings</div>'; return; }
  grid.innerHTML = '';
  recs.forEach((rec, idx) => {
    const card = document.createElement('div');
    card.className = 'rec-card';
    card.innerHTML = `
      <div class="rec-thumb" style="background:${thumbGrad(rec.name)}">
        <div class="rec-thumb-inner">🎵</div>
        <div class="rec-dur">1:00</div>
      </div>
      <div class="rec-info">
        <div class="rec-rtime">${rec.time} UTC</div>
        <div class="rec-rdate">${rec.date}</div>
        <div class="rec-rsize">${rec.size_kb} KB</div>
      </div>`;
    card.addEventListener('click', () => selectRec(idx));
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// VIEW TOGGLE
// ─────────────────────────────────────────────────────────────────────────────
const scrView  = document.getElementById('scrView');
const gridView = document.getElementById('gridView');
document.getElementById('viewScr').addEventListener('click', () => {
  scrView.style.display=''; gridView.style.display='none';
  document.getElementById('viewScr').classList.add('act');
  document.getElementById('viewGrid').classList.remove('act');
});
document.getElementById('viewGrid').addEventListener('click', () => {
  gridView.style.display=''; scrView.style.display='none';
  document.getElementById('viewGrid').classList.add('act');
  document.getElementById('viewScr').classList.remove('act');
  renderGrid();
});
document.getElementById('refreshBtn').addEventListener('click', loadRecordings);

loadRecordings();
</script>
</body>
</html>
